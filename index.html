<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthSync Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        :root { --main-bg: #f8fafc; --accent: #0284c7; }
        body { font-family: 'Inter', sans-serif; background: var(--main-bg); padding-bottom: 90px; overflow-x: hidden; }
        
        /* STRICT TAB ISOLATION */
        .page { display: none; width: 100%; max-width: 480px; margin: auto; padding: 15px; min-height: 80vh; }
        .page.active { display: block !important; }
        
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid #f1f5f9; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .tab-item { border: none; background: none; color: #94a3b8; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .tab-item.active { color: var(--accent); }
        
        .kiss-active { background: #fff1f2 !important; border: 2px solid #fb7185 !important; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .heart-beat { animation: pulse 0.8s infinite; color: #e11d48; }
        .filter-btn { padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; background: #f1f5f9; color: #64748b; }
        .filter-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white flex justify-between items-center shadow-xl">
        <div><h2 class="font-bold text-lg italic">HealthSync</h2><p class="text-[10px] text-sky-400 font-mono uppercase" id="user-display">...</p></div>
        <div class="text-right text-[10px] font-bold px-3 py-1 rounded-full bg-white/10" id="partner-status">OFFLINE</div>
    </div>
    
    <div id="kiss-meter" class="card mt-4 py-8 text-center border-2 border-dashed border-slate-200 cursor-pointer select-none touch-none transition-all">
        <i id="kiss-icon" class="fas fa-heart text-4xl text-slate-100"></i>
        <p id="kiss-text" class="text-[10px] font-black uppercase mt-2 text-slate-400">Hold for a Shared Kiss</p>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="sendSignal('miss')" class="card p-5 active:scale-95 transition text-center border-none shadow-md">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400 italic">I Miss You</span>
            <p id="my-miss-count" class="text-xl font-black text-slate-800">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5 active:scale-95 transition text-center border-none shadow-md">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400 italic">I Love You</span>
            <p id="my-love-count" class="text-xl font-black text-slate-800">0</p>
        </button>
    </div>

    <div class="card text-center">
        <p class="text-[10px] uppercase font-bold text-slate-400 mb-4 tracking-widest">Sentiment status</p>
        <div class="flex justify-around text-4xl mb-3">
            <button onclick="setMood('😊')">😊</button><button onclick="setMood('😢')">😢</button>
            <button onclick="setMood('❤️')">❤️</button><button onclick="setMood('😡')">😡</button>
            <button onclick="setMood('😭')">😭</button>
        </div>
        <p id="partner-mood" class="text-xs text-slate-500 mt-2">Partner is feeling: --</p>
    </div>

    <div class="card flex justify-between items-center" id="sleep-card">
        <div><p class="text-[10px] font-bold text-slate-400 uppercase">Sleep State</p><h3 id="sleep-timer" class="text-lg font-bold">Awake ☀️</h3></div>
        <button onclick="toggleSleep()" id="sleep-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-full text-xs font-bold">Goodnight</button>
    </div>
</div>

<div id="p-water" class="page">
    <div class="card text-center">
        <div class="flex justify-between text-[10px] font-bold mb-4"><span>GOAL: 2000ML</span></div>
        <div id="water-circ" class="w-40 h-40 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-sky-100 shadow-inner">
            <div class="text-center"><span id="current-ml" class="text-3xl font-black text-sky-600">0</span><br><span class="text-[10px] text-slate-400 uppercase font-bold">Total ML</span></div>
        </div>
        <input type="number" id="drink-amount" value="250" class="w-full bg-slate-50 border rounded-xl p-3 mb-2 text-center font-bold">
        <button onclick="drinkWater()" class="w-full bg-sky-500 text-white font-bold py-4 rounded-xl shadow-lg">Log Intake 💧</button>
    </div>
</div>

<div id="p-stats" class="page">
    <div class="flex justify-between mb-4 bg-white p-2 rounded-2xl shadow-sm border">
        <button class="filter-btn active" onclick="updateStatsFilter('daily', this)">Daily</button>
        <button class="filter-btn" onclick="updateStatsFilter('weekly', this)">Weekly</button>
        <button class="filter-btn" onclick="updateStatsFilter('monthly', this)">Monthly</button>
    </div>
    <div class="card">
        <h3 class="font-bold text-[10px] uppercase text-slate-400 mb-6 tracking-widest text-center">Leaderboard</h3>
        <div id="stats-container" class="space-y-6"></div>
    </div>
</div>

<div id="p-calories" class="page">
    <div class="card">
        <h3 class="font-bold text-xs uppercase mb-4 text-slate-400">Nutrient Intake</h3>
        <div class="flex gap-2 mb-4">
            <input type="text" id="food-input" placeholder="What did you eat?" class="flex-grow bg-slate-50 border rounded-xl px-4 py-2 text-sm">
            <button onclick="addCalories()" class="bg-emerald-600 text-white px-6 rounded-xl text-sm font-bold">LOG</button>
        </div>
        <div class="grid grid-cols-2 gap-4 h-64 overflow-y-auto">
            <div id="ledger-vinod" class="text-[10px] border-r pr-2"><b>Vinod:</b></div>
            <div id="ledger-cindy" class="text-[10px]"><b>Cindy:</b></div>
        </div>
    </div>
</div>

<div id="p-chat" class="page">
    <div class="card h-[75vh] flex flex-col bg-slate-50">
        <div id="chat-box" class="flex-grow overflow-y-auto space-y-4 p-2"></div>
        <div class="flex gap-2 p-3 bg-white rounded-3xl border shadow-sm mt-2">
            <input type="text" id="chat-input" placeholder="Message..." class="flex-grow px-2 py-1 text-sm outline-none">
            <button onclick="sendMessage()" class="bg-sky-500 text-white w-10 h-10 rounded-2xl flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')"><i class="fas fa-home"></i>Home</button>
    <button class="tab-item" onclick="showPage('water')"><i class="fas fa-droplet"></i>Water</button>
    <button class="tab-item" onclick="showPage('stats')"><i class="fas fa-trophy"></i>Stats</button>
    <button class="tab-item" onclick="showPage('calories')"><i class="fas fa-utensils"></i>Cals</button>
    <button class="tab-item" onclick="showPage('chat')"><i class="fas fa-comment"></i>Chat</button>
</div>

<script>
    // --- FIREBASE CONFIG (YOUR ACTUAL DB) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAcoPWV1RBE5DnRQHUo2EdKe0nEZOeZTr4",
        authDomain: "cindvin-740ac.firebaseapp.com",
        databaseURL: "https://cindvin-740ac-default-rtdb.firebaseio.com/",
        projectId: "cindvin-740ac",
        storageBucket: "cindvin-740ac.firebasestorage.app",
        messagingSenderId: "413173407072",
        appId: "1:413173407072:web:354efd879fde19dc035205"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem('hs_pro_v_stable') || prompt("Identify (Vinod/Cindy):");
    if(myName) myName = myName.charAt(0).toUpperCase() + myName.slice(1);
    localStorage.setItem('hs_pro_v_stable', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';
    document.getElementById('user-display').innerText = "Logged in: " + myName;

    // --- TAB NAVIGATION FIX ---
    function showPage(p) {
        $('.page').hide().removeClass('active');
        $('.tab-item').removeClass('active');
        $('#p-' + p).show().addClass('active');
        $(event.currentTarget).addClass('active');
        if(p === 'stats') fetchStats();
    }

    // --- PRESENCE (ONLINE/OFFLINE) ---
    const statusRef = db.ref('status/' + myName);
    db.ref('.info/connected').on('value', snap => {
        if (snap.val()) statusRef.onDisconnect().set('offline').then(() => statusRef.set('online'));
    });
    db.ref('status/' + partner).on('value', s => {
        const pStat = document.getElementById('partner-status');
        pStat.innerText = s.val() === 'online' ? 'ONLINE' : 'OFFLINE';
        pStat.style.color = s.val() === 'online' ? '#4ade80' : '#ffffff40';
    });

    // --- MOOD & SLEEP ---
    function setMood(e) { db.ref('users/' + myName + '/mood').set(e); }
    db.ref('users/' + partner + '/mood').on('value', s => { document.getElementById('partner-mood').innerText = partner + " feels: " + (s.val() || "😊"); });

    function toggleSleep() {
        const isS = document.getElementById('sleep-btn').innerText === "GOODNIGHT";
        db.ref('users/' + myName + '/sleeping').set(isS);
        document.getElementById('sleep-timer').innerText = isS ? "Sleeping... 😴" : "Awake ☀️";
        document.getElementById('sleep-btn').innerText = isS ? "WAKE UP" : "GOODNIGHT";
    }
    db.ref('users/' + partner + '/sleeping').on('value', s => {
        document.getElementById('partner-sleep-txt').innerText = "Status: " + (s.val() ? "Sleeping 😴" : "Awake ☀️");
    });

    // --- SIGNALS & STATS ---
    function sendSignal(t) { db.ref('stats/' + myName + '/' + t).transaction(c => (c || 0) + 1); }
    db.ref('stats/' + myName).on('value', s => {
        document.getElementById('my-miss-count').innerText = s.val()?.miss || 0;
        document.getElementById('my-love-count').innerText = s.val()?.love || 0;
    });

    let currentFilter = 'daily';
    function updateStatsFilter(f, btn) {
        currentFilter = f;
        $('.filter-btn').removeClass('active'); $(btn).addClass('active');
        fetchStats();
    }

    function fetchStats() {
        db.ref('stats').once('value', s => {
            const d = s.val() || { Vinod: {}, Cindy: {} };
            const vM = d.Vinod?.miss || 0, cM = d.Cindy?.miss || 0;
            const vL = d.Vinod?.love || 0, cL = d.Cindy?.love || 0;
            const totalM = (vM + cM) || 1, totalL = (vL + cL) || 1;
            
            let h = `
                <div class="space-y-4">
                    <div><p class="text-[9px] font-bold uppercase mb-1">Miss You Leaderboard</p>
                    <div class="flex h-4 rounded-full overflow-hidden bg-slate-100">
                        <div class="bg-sky-400" style="width:${(vM/totalM)*100}%"></div>
                        <div class="bg-rose-400" style="width:${(cM/totalM)*100}%"></div>
                    </div></div>
                    <div><p class="text-[9px] font-bold uppercase mb-1">Love Shared</p>
                    <div class="flex h-4 rounded-full overflow-hidden bg-slate-100">
                        <div class="bg-sky-400" style="width:${(vL/totalL)*100}%"></div>
                        <div class="bg-rose-400" style="width:${(cL/totalL)*100}%"></div>
                    </div></div>
                </div>`;
            document.getElementById('stats-container').innerHTML = h;
        });
    }

    // --- KISS METER ---
    $('#kiss-meter').on('pointerdown', () => db.ref('kiss/' + myName).set(true));
    $('#kiss-meter').on('pointerup mouseleave', () => db.ref('kiss/' + myName).set(false));
    db.ref('kiss').on('value', s => {
        if(s.val()?.Vinod && s.val()?.Cindy) { 
            $('#kiss-meter').addClass('kiss-active'); $('#kiss-icon').addClass('heart-beat');
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        } else {
            $('#kiss-meter').removeClass('kiss-active'); $('#kiss-icon').removeClass('heart-beat');
        }
    });

    // --- CALORIES & WATER ---
    function addCalories() {
        const f = document.getElementById('food-input').value;
        db.ref('ledger/' + myName).push({ item: f, cal: 150 });
        document.getElementById('food-input').value = "";
    }
    db.ref('ledger').on('value', s => {
        const d = s.val() || {};
        const render = (u, el) => {
            let h = `<b>${u}:</b><br>`;
            Object.values(d[u] || {}).forEach(e => { h += `${e.item}<br>`; });
            document.getElementById(el).innerHTML = h;
        };
        render('Vinod', 'ledger-vinod'); render('Cindy', 'ledger-cindy');
    });

    function drinkWater() {
        const amt = parseInt(document.getElementById('drink-amount').value);
        db.ref('users/' + myName + '/water').transaction(c => (c || 0) + amt);
    }
    db.ref('users/' + myName + '/water').on('value', s => {
        const curr = s.val() || 0;
        document.getElementById('current-ml').innerText = curr;
        const p = Math.min((curr / 2000) * 360, 360);
        document.getElementById('water-circ').style.background = `conic-gradient(#0ea5e9 ${p}deg, #f1f5f9 0deg)`;
    });

    // --- CHAT ---
    function sendMessage() {
        const t = document.getElementById('chat-input').value;
        if(t) db.ref('sync/chat').push({ f: myName, t: t });
        document.getElementById('chat-input').value = "";
    }
    db.ref('sync/chat').limitToLast(10).on('value', s => {
        let h = "";
        s.forEach(c => {
            const m = c.val();
            h += `<div class="p-3 rounded-2xl max-w-[85%] text-sm ${m.f === myName ? 'bg-sky-500 text-white ml-auto' : 'bg-white border'}">${m.t}</div>`;
        });
        document.getElementById('chat-box').innerHTML = h;
        document.getElementById('chat-box').scrollTop = 9999;
    });

</script>
</body>
</html>
