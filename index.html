<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthSync Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root { --main-bg: #f8fafc; --accent: #0284c7; }
        body { font-family: 'Inter', sans-serif; background: var(--main-bg); padding-bottom: 90px; overflow-x: hidden; }
        .page { display: none; width: 100%; max-width: 480px; margin: auto; padding: 15px; min-height: 80vh; }
        .page.active { display: block !important; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid #f1f5f9; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .tab-item { border: none; background: none; color: #94a3b8; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .tab-item.active { color: var(--accent); }
        #chessBoard { width: 100%; max-width: 350px; margin: 0 auto; border: 4px solid #334155; border-radius: 8px; }
        .kiss-active { background: #fff1f2 !important; border: 2px solid #fb7185 !important; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .heart-pulse { animation: pulse 0.8s infinite; color: #e11d48; }
    </style>
</head>
<body>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white flex justify-between items-center shadow-xl">
        <div>
            <h2 class="font-bold text-lg italic">HealthSync</h2>
            <p class="text-[10px] text-sky-400 font-mono uppercase" id="user-display">...</p>
        </div>
        <div class="text-right">
            <p class="text-[9px] uppercase opacity-50">Partner Battery</p>
            <p class="text-xs font-bold text-green-400" id="partner-battery">--%</p>
        </div>
    </div>
    
    <div id="kiss-meter" class="card mt-4 py-8 text-center border-2 border-dashed border-slate-200 cursor-pointer select-none touch-none transition-all">
        <i id="kiss-icon" class="fas fa-heart text-4xl text-slate-100"></i>
        <p id="kiss-text" class="text-[10px] font-black uppercase mt-2 text-slate-400">Hold for a Shared Kiss</p>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="sendSignal('miss')" class="card p-5 active:scale-95 transition text-center shadow-md border-none">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Miss You</span>
            <p id="my-miss-count" class="text-xl font-black text-slate-800">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5 active:scale-95 transition text-center shadow-md border-none">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Love You</span>
            <p id="my-love-count" class="text-xl font-black text-slate-800">0</p>
        </button>
    </div>

    <div class="card flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
            <span id="partner-mood" class="text-3xl">😊</span>
            <div>
                <p class="text-[10px] font-bold uppercase text-slate-400" id="partner-label">Cindy</p>
                <p id="partner-sleep-txt" class="text-xs font-bold text-slate-800">Awake ☀️</p>
            </div>
        </div>
        <button onclick="toggleSleep()" id="sleep-btn" class="bg-indigo-600 text-white px-5 py-2 rounded-full text-[10px] font-bold uppercase shadow-lg">Goodnight</button>
    </div>
</div>

<div id="p-water" class="page">
    <div class="card text-center">
        <div class="flex justify-between text-[10px] font-bold mb-4"><span>GOAL: 2000ML</span><span id="partner-water-info" class="text-slate-400 font-normal">Partner: 0ml</span></div>
        <div id="water-circ" class="w-40 h-40 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-sky-100">
            <div class="text-center"><span id="current-ml" class="text-3xl font-black text-sky-600">0</span><br><span class="text-[10px] text-slate-400 uppercase font-bold">Total ML</span></div>
        </div>
        <input type="number" id="drink-amount" value="250" class="w-full bg-slate-50 border rounded-2xl p-4 mb-3 text-center font-bold">
        <button onclick="drinkWater()" class="w-full bg-sky-500 text-white font-bold py-5 rounded-2xl shadow-xl">LOG INTAKE 💧</button>
    </div>
</div>

<div id="p-calories" class="page">
    <div class="card">
        <h3 class="font-bold text-xs uppercase mb-4 text-slate-400">Nutrient Intake</h3>
        <div class="flex gap-2 mb-4">
            <input type="text" id="food-input" placeholder="What did you eat?" class="flex-grow bg-slate-50 border rounded-xl px-4 py-2 text-sm">
            <button onclick="addCalories()" class="bg-emerald-600 text-white px-6 rounded-xl text-sm font-bold">LOG</button>
        </div>
        <div class="grid grid-cols-2 gap-4 h-64 overflow-y-auto bg-slate-50 p-3 rounded-xl">
            <div id="ledger-vinod" class="text-[10px] border-r border-slate-200 pr-2"><b>Vinod:</b></div>
            <div id="ledger-cindy" class="text-[10px]"><b>Cindy:</b></div>
        </div>
    </div>
</div>

<div id="p-games" class="page">
    <div class="card text-center">
        <div id="chessBoard" class="mb-4"></div>
        <div class="flex justify-between items-center text-[10px] font-bold px-2">
            <span id="chess-status" class="bg-slate-100 px-3 py-1 rounded-full uppercase">White to Move</span>
            <span class="text-amber-600">Wish Tokens: <span id="wish-count">0</span></span>
        </div>
        <button onclick="resetChess()" class="w-full mt-4 bg-slate-800 text-white py-4 rounded-xl text-[10px] font-bold uppercase tracking-widest">Reset Board</button>
    </div>
</div>

<div id="p-chat" class="page">
    <div class="card h-[75vh] flex flex-col bg-slate-50 p-2 border-none">
        <div id="chat-box" class="flex-grow overflow-y-auto space-y-4 p-2"></div>
        <div class="flex gap-2 p-3 bg-white rounded-3xl border shadow-sm mt-2">
            <input type="text" id="chat-input" placeholder="Message..." class="flex-grow px-2 py-1 text-sm outline-none">
            <button onclick="sendMessage()" class="bg-sky-500 text-white w-10 h-10 rounded-2xl flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')"><i class="fas fa-home"></i>Home</button>
    <button class="tab-item" onclick="showPage('water')"><i class="fas fa-droplet"></i>Water</button>
    <button class="tab-item" onclick="showPage('calories')"><i class="fas fa-utensils"></i>Cals</button>
    <button class="tab-item" onclick="showPage('games')"><i class="fas fa-chess-knight"></i>Play</button>
    <button class="tab-item" onclick="showPage('chat')"><i class="fas fa-comment"></i>Chat</button>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAcoPWV1RBE5DnRQHUo2EdKe0nEZOeZTr4",
        authDomain: "cindvin-740ac.firebaseapp.com",
        databaseURL: "https://cindvin-740ac-default-rtdb.firebaseio.com/",
        projectId: "cindvin-740ac",
        storageBucket: "cindvin-740ac.firebasestorage.app",
        messagingSenderId: "413173407072",
        appId: "1:413173407072:web:354efd879fde19dc035205"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem('hs_pro_v_final') || prompt("Identify (Vinod/Cindy):");
    if(myName) myName = myName.charAt(0).toUpperCase() + myName.slice(1);
    localStorage.setItem('hs_pro_v_final', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';
    
    document.getElementById('user-display').innerText = "LOGGED IN: " + myName;
    document.getElementById('partner-label').innerText = partner;

    // --- 1. BATTERY SYNC ---
    if ('getBattery' in navigator) {
        navigator.getBattery().then(battery => {
            const updateBattery = () => {
                db.ref('users/' + myName + '/battery').set(Math.round(battery.level * 100));
            };
            battery.addEventListener('levelchange', updateBattery);
            updateBattery();
        });
    }
    db.ref('users/' + partner + '/battery').on('value', s => {
        document.getElementById('partner-battery').innerText = (s.val() || '--') + "%";
    });

    // --- 2. NOTIFICATION REGISTRATION ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            Notification.requestPermission();
        });
    }

    // --- 3. KISS METER ---
    const kissMeter = document.getElementById('kiss-meter');
    const kissIcon = document.getElementById('kiss-icon');
    const kissText = document.getElementById('kiss-text');

    kissMeter.addEventListener('pointerdown', () => db.ref('kiss_meter/' + myName).set(true));
    kissMeter.addEventListener('pointerup', () => db.ref('kiss_meter/' + myName).set(false));
    kissMeter.addEventListener('pointerleave', () => db.ref('kiss_meter/' + myName).set(false));

    db.ref('kiss_meter').on('value', s => {
        const data = s.val() || {};
        if (data.Vinod && data.Cindy) {
            document.body.style.background = "#fff1f2";
            kissMeter.classList.add('kiss-active');
            kissIcon.classList.add('heart-pulse');
            kissIcon.style.color = "#e11d48";
            kissText.innerText = "KISSING IN REAL TIME...";
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        } else {
            document.body.style.background = "#f8fafc";
            kissMeter.classList.remove('kiss-active');
            kissIcon.classList.remove('heart-pulse');
            kissIcon.style.color = data[myName] ? "#fb7185" : "#e2e8f0";
            kissText.innerText = data[myName] ? "WAITING FOR " + partner : "Hold for a Shared Kiss";
        }
    });

    // --- 4. CHESS LOGIC ---
    var game = new Chess();
    var board = Chessboard('chessBoard', {
        draggable: true, position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: (src, piece) => {
            if (game.game_over()) return false;
            if ((myName === 'Vinod' && piece.search(/^b/) !== -1) || 
                (myName === 'Cindy' && piece.search(/^w/) !== -1)) return false;
        },
        onDrop: (src, tgt) => {
            let m = game.move({ from: src, to: tgt, promotion: 'q' });
            if (m === null) return 'snapback';
            db.ref('sync/chess').set(game.fen());
        }
    });
    db.ref('sync/chess').on('value', s => { if(s.val() && s.val() !== game.fen()){ game.load(s.val()); board.position(s.val()); updateChess(); }});
    function updateChess() {
        document.getElementById('chess-status').innerText = game.turn() === 'w' ? "White Turn" : "Black Turn";
        if(game.in_checkmate()) { db.ref('users/' + myName + '/wishes').transaction(w => (w || 0) + 1); alert("Win! Token added."); }
    }
    function resetChess() { game.reset(); board.start(); db.ref('sync/chess').set(game.fen()); }
    db.ref('users/' + myName + '/wishes').on('value', s => { document.getElementById('wish-count').innerText = s.val() || 0; });

    // --- 5. WATER & CALORIES ---
    function drinkWater() {
        const amt = parseInt(document.getElementById('drink-amount').value);
        db.ref('users/' + myName + '/water').transaction(c => (c || 0) + amt);
    }
    db.ref('users/' + myName + '/water').on('value', s => {
        const curr = s.val() || 0;
        document.getElementById('current-ml').innerText = curr;
        document.getElementById('water-circ').style.background = `conic-gradient(#0ea5e9 ${(curr/2000)*360}deg, #f1f5f9 0deg)`;
    });
    db.ref('users/' + partner + '/water').on('value', s => { document.getElementById('partner-water-info').innerText = partner + ": " + (s.val() || 0) + "ml"; });

    function addCalories() {
        const f = document.getElementById('food-input').value;
        if(f) db.ref('ledger/' + myName).push({ item: f, cal: 150 });
        document.getElementById('food-input').value = "";
    }
    db.ref('ledger').on('value', s => {
        const data = s.val() || {};
        const render = (u, el) => {
            let h = "";
            Object.values(data[u] || {}).forEach(e => { h += `<div class='border-b py-1'>${e.item} - 150kcal</div>`; });
            document.getElementById(el).innerHTML = `<b>${u}:</b><br>` + h;
        };
        render('Vinod', 'ledger-vinod'); render('Cindy', 'ledger-cindy');
    });

    // --- 6. MISC SYNC ---
    function sendSignal(t) { db.ref('stats/' + myName + '/' + t).transaction(c => (c || 0) + 1); }
    db.ref('stats/' + myName).on('value', s => {
        document.getElementById('my-miss-count').innerText = s.val()?.miss || 0;
        document.getElementById('my-love-count').innerText = s.val()?.love || 0;
    });

    function toggleSleep() {
        const isS = document.getElementById('sleep-btn').innerText === "GOODNIGHT";
        db.ref('users/' + myName + '/sleeping').set(isS);
        document.getElementById('sleep-timer').innerText = isS ? "Sleeping... 😴" : "I'm Awake ☀️";
        document.getElementById('sleep-btn').innerText = isS ? "WAKE UP" : "GOODNIGHT";
    }
    db.ref('users/' + partner + '/sleeping').on('value', s => {
        document.getElementById('partner-sleep-txt').innerText = s.val() ? "Sleeping 😴" : "Awake ☀️";
    });

    function sendMessage() {
        const t = document.getElementById('chat-input').value;
        if(t) db.ref('sync/chat').push({ f: myName, t: t });
        document.getElementById('chat-input').value = "";
    }
    db.ref('sync/chat').limitToLast(10).on('value', s => {
        let h = "";
        s.forEach(c => {
            const m = c.val();
            h += `<div class="p-3 rounded-2xl max-w-[85%] text-sm ${m.f === myName ? 'bg-sky-500 text-white ml-auto' : 'bg-white border'}">${m.t}</div>`;
        });
        document.getElementById('chat-box').innerHTML = h;
        document.getElementById('chat-box').scrollTop = 9999;
    });

    function showPage(p) {
        $('.page').hide(); $('#p-' + p).show();
        $('.tab-item').removeClass('active'); $(event.currentTarget).addClass('active');
        if(p === 'games') board.resize();
    }
</script>
</body>
</html>
