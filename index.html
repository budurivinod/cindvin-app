<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CindVin - Connected</title>
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --romance-pink: #ffafbd; --romance-red: #ff4b2b; --water-blue: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to bottom, #ffafbd, #ffc3a0); margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        .page { display: none; width: 100%; max-width: 450px; margin: auto; padding: 15px; padding-bottom: 120px; }
        .page.active { display: block !important; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); margin-bottom: 15px; border: 2px solid white; }
        .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: white; display: flex; justify-content: space-around; padding: 12px 0 30px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 9999; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .tab-item { border: none; background: none; color: #999; font-size: 0.6rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .tab-item.active { color: var(--romance-red); }
        .circular-progress { width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--water-blue) 0deg, #ffebee 0deg); transition: 0.5s ease; margin: 15px auto; }
        .inner-circle { width: 130px; height: 130px; background: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ttt-cell { aspect-ratio: 1; background: #f8fafc; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; border: 1px solid #eee; }
        #win-overlay { position: fixed; inset: 0; background: rgba(255, 75, 43, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; color: white; }
        .letter-btn { width: 30px; height: 35px; background: #eee; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        .letter-btn:disabled { opacity: 0.3; }
    </style>
</head>
<body>

<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-[9999]">💝 Syncing...</div>

<div id="win-overlay">
    <i class="fas fa-trophy text-6xl mb-4"></i>
    <h1 class="text-3xl font-black mb-2" id="winner-display">WINNER!</h1>
    <p class="mb-6 font-bold">+5 Points Added!</p>
    <button onclick="closeWin()" class="bg-white text-rose-500 px-8 py-3 rounded-full font-bold shadow-lg">Play Again</button>
</div>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white border-none flex justify-between items-center">
        <div><h2 class="font-bold">CindVin Hub</h2><p id="user-display" class="text-[9px] opacity-60 uppercase"></p></div>
        <div class="text-right text-xs font-bold" id="partner-status">● Offline</div>
    </div>
    <div id="kiss-meter" class="card py-8 cursor-pointer select-none touch-none text-center">
        <i id="kiss-icon" class="fas fa-heart text-4xl text-slate-200"></i>
        <p id="kiss-text" class="text-xs font-bold uppercase mt-3 text-slate-400">Hold for Shared Kiss</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="sendSignal('miss')" class="card p-5 active:scale-95 transition">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Miss You</span>
            <p id="my-miss-count" class="text-xl font-black">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5 active:scale-95 transition">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Love You</span>
            <p id="my-love-count" class="text-xl font-black">0</p>
        </button>
    </div>
    <div class="card flex justify-between items-center">
        <p id="partner-sleep-txt" class="text-xs font-bold">Partner is Awake ☀️</p>
        <button id="sleep-btn" onclick="toggleSleep()" class="bg-indigo-600 text-white px-5 py-2 rounded-full text-[10px] font-bold">Goodnight</button>
    </div>
</div>

<div id="p-water" class="page">
    <div class="card">
        <div class="flex justify-between font-bold text-rose-600 mb-2">
            <span>🎯 Target: 2000ml</span>
            <span>🪙 <span id="coin-count">0</span></span>
        </div>
        <div class="circular-progress" id="progress-circle">
            <div class="inner-circle">
                <span id="current-ml" class="text-2xl font-bold text-sky-500">0</span>
                <span class="text-[8px] text-gray-500">ml total</span>
            </div>
        </div>
        <input type="number" id="drink-amount" value="250" class="w-full border p-3 rounded-xl mb-2 text-center text-lg">
        <button onclick="drinkWater()" class="w-full bg-sky-500 text-white font-bold py-3 rounded-xl">Drink 💧</button>
        <button onclick="resetToday()" class="w-full bg-rose-200 text-rose-700 text-xs mt-2 py-2 rounded-xl">Reset Today 🔄</button>
    </div>
</div>

<div id="p-calories" class="page">
    <div class="card">
        <h3 class="text-xs font-bold text-rose-600 mb-4 uppercase">Today's Nutrition</h3>
        <div class="flex gap-2">
            <input type="text" id="food-input" placeholder="What did you eat?" class="flex-1 border p-2 rounded-lg text-sm">
            <input type="number" id="food-cal" placeholder="kcal" class="w-20 border p-2 rounded-lg text-sm">
            <button onclick="addFood()" class="bg-rose-500 text-white px-4 rounded-lg"><i class="fas fa-plus"></i></button>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-4 text-left">
            <div><p class="text-[9px] font-bold border-b mb-2">VINOD</p><div id="food-list-vinod" class="text-[10px] space-y-1"></div></div>
            <div><p class="text-[9px] font-bold border-b mb-2">CINDY</p><div id="food-list-cindy" class="text-[10px] space-y-1"></div></div>
        </div>
    </div>
</div>

<div id="p-games" class="page">
    <div class="flex justify-around mb-4 bg-white p-2 rounded-2xl border">
        <button class="px-3 py-1 text-[10px] font-bold rounded-lg bg-rose-500 text-white" onclick="showSubGame('ttt')">TicTac</button>
        <button class="px-3 py-1 text-[10px] font-bold rounded-lg bg-slate-100" onclick="showSubGame('hangman')">Hangman</button>
    </div>
    <div id="sub-ttt" class="card">
        <div class="ttt-grid" id="ttt-board">
            <div class="ttt-cell" onclick="playTTT(0)"></div><div class="ttt-cell" onclick="playTTT(1)"></div><div class="ttt-cell" onclick="playTTT(2)"></div>
            <div class="ttt-cell" onclick="playTTT(3)"></div><div class="ttt-cell" onclick="playTTT(4)"></div><div class="ttt-cell" onclick="playTTT(5)"></div>
            <div class="ttt-cell" onclick="playTTT(6)"></div><div class="ttt-cell" onclick="playTTT(7)"></div><div class="ttt-cell" onclick="playTTT(8)"></div>
        </div>
    </div>
    <div id="sub-hangman" class="card hidden">
        <div id="hangman-setup">
            <p class="text-xs mb-2 font-bold text-slate-400">Set word for Partner</p>
            <input type="password" id="hangman-word-input" class="border p-2 rounded w-full mb-2 text-center" placeholder="Secret Word">
            <button onclick="setHangmanWord()" class="bg-rose-500 text-white w-full py-2 rounded font-bold">Set Word</button>
        </div>
        <div id="hangman-play" class="hidden">
            <div id="hangman-display" class="text-2xl tracking-widest font-bold mb-4 text-rose-500"></div>
            <p class="text-[10px] mb-4">Lives: <span id="hangman-lives">6</span></p>
            <div id="hangman-keyboard" class="flex flex-wrap gap-1 justify-center"></div>
        </div>
        <p id="hangman-status" class="mt-4 text-[10px] font-bold italic"></p>
    </div>
</div>

<div id="p-chat" class="page">
    <div class="card h-[70vh] flex flex-col p-2">
        <div id="chat-box" class="flex-grow overflow-y-auto space-y-3 p-2"></div>
        <div class="flex gap-2 p-2 border-t">
            <input type="text" id="chat-input" placeholder="Message..." class="flex-1 p-2 text-sm outline-none">
            <button onclick="sendMessage()" class="bg-rose-500 text-white px-4 rounded-xl"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')">🏠<span>HUB</span></button>
    <button class="tab-item" onclick="showPage('water')">💧<span>WATER</span></button>
    <button class="tab-item" onclick="showPage('calories')">🥗<span>CALS</span></button>
    <button class="tab-item" onclick="showPage('chat')">💬<span>CHAT</span></button>
    <button class="tab-item" onclick="showPage('games')">🎮<span>PLAY</span></button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAkDjO1Zk_KsqnBhOYdZw8hX6ebcDv2TM8",
        authDomain: "watertracker-7c2d3.firebaseapp.com",
        databaseURL: "https://watertracker-7c2d3-default-rtdb.firebaseio.com",
        projectId: "watertracker-7c2d3",
        storageBucket: "watertracker-7c2d3.firebasestorage.app",
        messagingSenderId: "1085308071765",
        appId: "1:1085308071765:web:4fd76906f520bbde2b09dc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem('hs_user') || prompt("Identity (Vinod/Cindy):");
    localStorage.setItem('hs_user', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';

    // --- NOTIFS & UTILS ---
    function triggerNotif(type, body) {
        db.ref('notifs/' + partner).set({ type, body, ts: Date.now() });
        if (navigator.vibrate) navigator.vibrate(200);
    }
    db.ref('notifs/' + myName).on('value', s => {
        const n = s.val(); if(!n) return;
        if(Date.now() - n.ts < 3000) {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
    });

    // --- CALORIES (DAILY SYNC) ---
    function getToday() { return new Date().toLocaleDateString().replace(/\//g, '-'); }
    function addFood() {
        const n = document.getElementById('food-input').value, c = parseInt(document.getElementById('food-cal').value);
        if(n && c) db.ref('calories/' + getToday() + '/' + myName).push({n, c});
        document.getElementById('food-input').value = ""; document.getElementById('food-cal').value = "";
    }
    db.ref('calories/' + getToday()).on('value', s => {
        const data = s.val() || {};
        ['Vinod', 'Cindy'].forEach(u => {
            const list = document.getElementById('food-list-' + u.toLowerCase());
            let total = 0, html = "";
            Object.values(data[u] || {}).forEach(f => { total += f.c; html += `<div class="flex justify-between border-b py-1"><span>${f.n}</span><span>${f.c}</span></div>`; });
            list.innerHTML = html;
            if(u === myName) { document.getElementById('cal-eaten').innerText = total; document.getElementById('cal-left').innerText = 2000 - total; }
        });
    });

    // --- HANGMAN SYNC ---
    function setHangmanWord() {
        const word = document.getElementById('hangman-word-input').value.trim().toUpperCase();
        if(word.length < 2) return;
        db.ref('games/hangman').set({
            word: word,
            setter: myName,
            guesses: "",
            lives: 6,
            status: "playing"
        });
        document.getElementById('hangman-word-input').value = "";
    }

    db.ref('games/hangman').on('value', s => {
        const g = s.val();
        const setup = document.getElementById('hangman-setup'), play = document.getElementById('hangman-play');
        const status = document.getElementById('hangman-status');
        
        if(!g || g.status === "won") {
            setup.classList.remove('hidden'); play.classList.add('hidden');
            status.innerText = g?.status === "won" ? (g.setter === myName ? partner + " guessed it!" : "You Won!") : "";
            return;
        }

        if(g.setter === myName) {
            setup.classList.add('hidden'); play.classList.remove('hidden');
            document.getElementById('hangman-keyboard').innerHTML = "<p class='text-xs'>Waiting for partner...</p>";
            status.innerText = "Word set: " + g.word;
        } else {
            setup.classList.add('hidden'); play.classList.remove('hidden');
            renderHangmanPlay(g);
        }
        
        // Render word underscores
        let display = "";
        for(let char of g.word) display += g.guesses.includes(char) ? char + " " : "_ ";
        document.getElementById('hangman-display').innerText = display;
        document.getElementById('hangman-lives').innerText = g.lives;
    });

    function renderHangmanPlay(g) {
        let kb = "";
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
            const used = g.guesses.includes(l);
            kb += `<button class="letter-btn" ${used ? 'disabled' : ''} onclick="guessLetter('${l}')">${l}</button>`;
        });
        document.getElementById('hangman-keyboard').innerHTML = kb;
    }

    function guessLetter(l) {
        db.ref('games/hangman').once('value', s => {
            const g = s.val();
            let newGuesses = g.guesses + l;
            let newLives = g.word.includes(l) ? g.lives : g.lives - 1;
            
            let won = true;
            for(let char of g.word) if(!newGuesses.includes(char)) won = false;

            if(won) {
                db.ref('users/' + myName + '/points').transaction(p => (p || 0) + 5);
                db.ref('games/hangman/status').set("won");
                document.getElementById('winner-display').innerText = "HANGMAN WON!";
                document.getElementById('win-overlay').style.display = 'flex';
            } else if(newLives <= 0) {
                db.ref('games/hangman').remove();
            } else {
                db.ref('games/hangman').update({ guesses: newGuesses, lives: newLives });
            }
        });
    }

    // --- TIC TAC TOE ---
    function playTTT(i) {
        db.ref('ttt').once('value', s => {
            const g = s.val() || { board: Array(9).fill(""), turn: "Vinod" };
            if(g.turn !== myName || g.board[i]) return;
            g.board[i] = (myName === 'Vinod' ? 'X' : 'O'); g.turn = partner;
            db.ref('ttt').set(g);
        });
    }
    db.ref('ttt').on('value', s => {
        const g = s.val() || { board: Array(9).fill(""), turn: "Vinod" };
        g.board.forEach((v, i) => document.querySelectorAll('.ttt-cell')[i].innerText = v || "");
        const win = checkWin(g.board);
        if(win) {
            const winner = win === 'X' ? 'Vinod' : 'Cindy';
            document.getElementById('winner-display').innerText = winner.toUpperCase() + " WINS!";
            document.getElementById('win-overlay').style.display = 'flex';
            if(winner === myName) db.ref('users/' + myName + '/points').transaction(p => (p || 0) + 5);
        }
    });
    function checkWin(b) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let l of lines) if(b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return b[l[0]];
        return null;
    }
    function resetTTT() { db.ref('ttt').set({ board: Array(9).fill(""), turn: "Vinod" }); }

    // --- CORE RECOVERY (WATER & HOME) ---
    function drinkWater() {
        const amt = parseInt(document.getElementById('drink-amount').value) || 0;
        const today = getToday();
        db.ref('users/' + myName).once('value', s => {
            const d = s.val() || { daily: {}, coins: 0 };
            const old = d.daily[today] || 0;
            d.daily[today] = old + amt;
            if(d.daily[today] >= 2000 && old < 2000) d.coins = (d.coins || 0) + 10;
            db.ref('users/' + myName).set(d);
        });
    }
    db.ref('users/' + myName).on('value', snap => {
        const d = snap.val() || { daily: {}, coins: 0 };
        const curr = d.daily?.[getToday()] || 0;
        document.getElementById('current-ml').innerText = curr;
        document.getElementById('coin-count').innerText = d.coins || 0;
        const p = Math.min((curr / 2000) * 360, 360);
        document.getElementById('progress-circle').style.background = `conic-gradient(var(--water-blue) ${p}deg, #ffebee 0deg)`;
        document.getElementById('loading').style.display = 'none';
    });

    // --- NAVIGATION & SIGNALS ---
    function showPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
        document.getElementById('p-' + p).classList.add('active');
        const activeTab = Array.from(document.querySelectorAll('.tab-item')).find(t => t.getAttribute('onclick').includes(p));
        if(activeTab) activeTab.classList.add('active');
    }
    function showSubGame(g) {
        document.querySelectorAll('#p-games .card').forEach(c => c.classList.add('hidden'));
        document.getElementById('sub-' + g).classList.remove('hidden');
    }
    function closeWin() { document.getElementById('win-overlay').style.display = 'none'; resetTTT(); db.ref('games/hangman').remove(); }

    db.ref('status/' + myName).onDisconnect().set('offline');
    db.ref('status/' + myName).set('online');
    db.ref('status/' + partner).on('value', s => {
        document.getElementById('partner-status').innerText = s.val() === 'online' ? '● Online' : '● Offline';
        document.getElementById('partner-status').style.color = s.val() === 'online' ? '#4ade80' : '#94a3b8';
    });
</script>
</body>
</html>
