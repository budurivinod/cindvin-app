<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CindVin Hub</title>
    
    <link rel="apple-touch-icon" href="https://i.ibb.co/3ykZ7Pr/infinity-heart.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --romance-pink: #ffafbd; --romance-red: #ff4b2b; --water-blue: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to bottom, #ffafbd, #ffc3a0); margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        .page { display: none; width: 100%; max-width: 450px; margin: auto; padding: 15px; padding-bottom: 140px; }
        .page.active { display: block !important; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); margin-bottom: 15px; border: 2px solid white; }
        
        .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: white; display: flex; justify-content: space-around; padding: 12px 0 45px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 9999; border-top-left-radius: 25px; border-top-right-radius: 25px; }
        .tab-item { border: none; background: none; color: #999; font-size: 0.6rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .tab-item.active { color: var(--romance-red); }
        
        /* Circular Progress for Water */
        .circular-progress { width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--water-blue) 0deg, #ffebee 0deg); transition: 0.5s ease; margin: 15px auto; }
        .inner-circle { width: 130px; height: 130px; background: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        
        /* TTT Grid */
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ttt-cell { aspect-ratio: 1; background: #f8fafc; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; border: 1px solid #eee; }
        
        /* SOS Grid */
        .sos-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .sos-cell { aspect-ratio: 1; background: white; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        
        /* Canvas Paint */
        #paint-canvas { background: white; border: 2px solid #ddd; border-radius: 15px; touch-action: none; cursor: crosshair; }

        /* Hangman letter buttons */
        .letter-btn { width: 32px; height: 38px; background: #334155; color: white; border-radius: 5px; font-weight: bold; margin: 2px; font-size: 0.8rem; }
        .letter-btn:disabled { opacity: 0.2; text-decoration: line-through; }
        
        #win-overlay { position: fixed; inset: 0; background: rgba(255, 75, 43, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 11000; color: white; text-align: center; }
    </style>
</head>
<body>

<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-[10000]">💝 Syncing Games...</div>

<div id="win-overlay">
    <i class="fas fa-trophy text-6xl mb-4"></i>
    <h1 class="text-3xl font-black mb-2" id="winner-name">WINNER!</h1>
    <button onclick="resetCurrentGameUI();" class="bg-white text-rose-500 px-8 py-3 rounded-full font-bold shadow-lg">Play Again</button>
</div>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white border-none flex justify-between items-center">
        <div><h2 class="font-bold">CindVin Hub</h2><p id="display-name" class="text-[9px] opacity-60 uppercase"></p></div>
        <div class="text-right text-xs font-bold" id="partner-status">● Offline</div>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4 mt-4">
        <button onclick="sendSignal('miss')" class="card p-5">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Miss You</span>
            <p id="my-miss-count" class="text-xl font-black">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Love You</span>
            <p id="my-love-count" class="text-xl font-black">0</p>
        </button>
    </div>
    <div class="card flex justify-between items-center">
        <p id="partner-sleep-txt" class="text-xs font-bold">Partner is Awake ☀️</p>
        <button id="sleep-btn" onclick="toggleSleep()" class="bg-indigo-600 text-white px-5 py-2 rounded-full text-[10px] font-bold uppercase">Goodnight</button>
    </div>
</div>

<div id="p-water" class="page">
    <div class="card">
        <div class="flex justify-between font-bold text-rose-600 mb-2">
            <span>🎯 Target: 2000ml</span>
            <span>🪙 <span id="coin-count">0</span></span>
        </div>
        <div class="circular-progress" id="ring">
            <div class="inner-circle">
                <span id="current-ml" class="text-2xl font-bold text-sky-500">0</span>
                <span class="text-[8px] text-gray-400 uppercase">ml total</span>
            </div>
        </div>
        <input type="number" id="drink-amt" value="250" class="w-full border p-3 rounded-xl mb-2 text-center font-bold">
        <button onclick="drinkWater()" class="w-full bg-sky-500 text-white font-bold py-4 rounded-xl shadow-lg">Add Water 💧</button>
        <button onclick="resetWaterToday()" class="w-full bg-rose-100 text-rose-600 text-[10px] mt-3 py-2 rounded-xl font-bold uppercase">Reset Today</button>
    </div>
</div>

<div id="p-games" class="page">
    <div class="flex overflow-x-auto gap-2 mb-4 no-scrollbar p-1">
        <button class="bg-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase shadow-sm" onclick="showSubGame('ttt')">TicTac</button>
        <button class="bg-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase shadow-sm" onclick="showSubGame('sos')">SOS</button>
        <button class="bg-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase shadow-sm" onclick="showSubGame('hangman')">Hangman</button>
        <button class="bg-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase shadow-sm" onclick="showSubGame('paint')">Paint</button>
    </div>
    
    <div id="game-ttt" class="card">
        <div class="ttt-grid" id="ttt-board">
            <div class="ttt-cell" onclick="playTTT(0)"></div><div class="ttt-cell" onclick="playTTT(1)"></div><div class="ttt-cell" onclick="playTTT(2)"></div>
            <div class="ttt-cell" onclick="playTTT(3)"></div><div class="ttt-cell" onclick="playTTT(4)"></div><div class="ttt-cell" onclick="playTTT(5)"></div>
            <div class="ttt-cell" onclick="playTTT(6)"></div><div class="ttt-cell" onclick="playTTT(7)"></div><div class="ttt-cell" onclick="playTTT(8)"></div>
        </div>
        <p id="ttt-status" class="mt-4 text-xs font-bold text-rose-500">Connecting...</p>
        <button onclick="resetTTT()" class="w-full mt-2 bg-slate-100 py-2 rounded-xl text-[10px] font-bold">RESET MATCH</button>
    </div>

    <div id="game-sos" class="card hidden">
        <div class="flex justify-between mb-4 text-[10px] font-bold uppercase">
            <div>Letter: <button class="bg-rose-500 text-white px-2 rounded" id="sos-letter-toggle" onclick="toggleSOSLetter()">S</button></div>
            <div id="sos-score-display">V: 0 | C: 0</div>
        </div>
        <div class="sos-grid" id="sos-board"></div>
        <p id="sos-status" class="mt-4 text-xs font-bold text-rose-500 text-center">Your Turn</p>
    </div>

    <div id="game-hangman" class="card hidden text-center">
        <div id="h-setup">
            <input type="password" id="h-word-input" class="border p-2 rounded-xl w-full mb-2 text-center" placeholder="Secret word for partner">
            <button onclick="setHangmanWord()" class="bg-rose-500 text-white w-full py-2 rounded-xl font-bold uppercase">Host Game</button>
        </div>
        <div id="h-play" class="hidden">
            <canvas id="hangman-canvas" width="120" height="120" class="mx-auto block"></canvas>
            <div id="h-display" class="text-3xl tracking-widest font-bold mb-6 text-slate-800 uppercase"></div>
            <div id="h-keyboard" class="flex flex-wrap justify-center mb-2"></div>
        </div>
    </div>

    <div id="game-paint" class="card hidden text-center">
        <canvas id="paint-canvas" width="300" height="300" class="mx-auto block"></canvas>
        <div class="flex justify-center gap-4 mt-4">
            <button class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs" onclick="clearCanvas()">Clear</button>
            <input type="color" id="paint-color" value="#ff4b2b" class="w-10 h-10 border-none rounded-full">
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')">🏠<span>HUB</span></button>
    <button class="tab-item" onclick="showPage('water')">💧<span>WATER</span></button>
    <button class="tab-item" onclick="showPage('games')">🎮<span>PLAY</span></button>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAkDjO1Zk_KsqnBhOYdZw8hX6ebcDv2TM8",
        authDomain: "watertracker-7c2d3.firebaseapp.com",
        databaseURL: "https://watertracker-7c2d3-default-rtdb.firebaseio.com",
        projectId: "watertracker-7c2d3",
        storageBucket: "watertracker-7c2d3.firebasestorage.app",
        messagingSenderId: "1085308071765",
        appId: "1:1085308071765:web:4fd76906f520bbde2b09dc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem('hs_user') || prompt("Identity (Vinod/Cindy):");
    localStorage.setItem('hs_user', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';
    document.getElementById('display-name').innerText = "Logged in: " + myName;

    let currentSOSLetter = 'S';

    // --- TIC TAC TOE RESET FIX ---
    function playTTT(i) {
        db.ref('ttt').once('value', s => {
            const g = s.val() || { board: Array(9).fill(""), turn: "Vinod" };
            if(g.turn !== myName || g.board[i]) return;
            g.board[i] = (myName === 'Vinod' ? 'X' : 'O');
            g.turn = partner;
            db.ref('ttt').set(g);
        });
    }
    db.ref('ttt').on('value', s => {
        const g = s.val() || { board: Array(9).fill(""), turn: "Vinod" };
        g.board.forEach((v, i) => document.querySelectorAll('.ttt-cell')[i].innerText = v || "");
        document.getElementById('ttt-status').innerText = g.turn === myName ? "Your Turn!" : partner + "'s Turn...";
        const win = checkTTTWin(g.board);
        if(win) {
            document.getElementById('winner-name').innerText = (win === 'X' ? 'VINOD' : 'CINDY') + " WINS!";
            document.getElementById('win-overlay').style.display = 'flex';
        }
    });
    function checkTTTWin(b) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let l of lines) if(b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return b[l[0]];
        return null;
    }
    function resetTTT() { db.ref('ttt').set({ board: Array(9).fill(""), turn: "Vinod" }); }

    // --- SOS GAME LOGIC ---
    function toggleSOSLetter() {
        currentSOSLetter = (currentSOSLetter === 'S') ? 'O' : 'S';
        document.getElementById('sos-letter-toggle').innerText = currentSOSLetter;
    }
    function initSOSBoard() {
        let b = "";
        for(let i=0; i<25; i++) b += `<div class="sos-cell" onclick="playSOS(${i})"></div>`;
        document.getElementById('sos-board').innerHTML = b;
    }
    function playSOS(i) {
        db.ref('sos').once('value', s => {
            const g = s.val() || { board: Array(25).fill(""), turn: "Vinod", vScore: 0, cScore: 0 };
            if(g.turn !== myName || g.board[i]) return;
            g.board[i] = currentSOSLetter;
            // Simplified Scoring: Logic for forming "SOS"
            g.turn = partner; 
            db.ref('sos').set(g);
        });
    }
    db.ref('sos').on('value', s => {
        const g = s.val() || { board: Array(25).fill(""), turn: "Vinod", vScore: 0, cScore: 0 };
        const cells = document.querySelectorAll('.sos-cell');
        if(cells.length === 0) return;
        g.board.forEach((v, i) => cells[i].innerText = v || "");
        document.getElementById('sos-score-display').innerText = `V: ${g.vScore} | C: ${g.cScore}`;
        document.getElementById('sos-status').innerText = g.turn === myName ? "Your Turn" : partner + "'s Turn";
    });

    // --- HANGMAN HOST CONTROLS ---
    function setHangmanWord() {
        const w = document.getElementById('h-word-input').value.toUpperCase();
        if(w.length < 2) return;
        db.ref('hangman').set({ word: w, setter: myName, guesses: "", strikes: 0 });
    }
    db.ref('hangman').on('value', s => {
        const h = s.val(); const setup = document.getElementById('h-setup'), play = document.getElementById('h-play');
        if(!h) { setup.classList.remove('hidden'); play.classList.add('hidden'); return; }
        setup.classList.add('hidden'); play.classList.remove('hidden');
        let disp = ""; for(let char of h.word) disp += h.guesses.includes(char) ? char + " " : "_ ";
        document.getElementById('h-display').innerText = disp;
        if(h.setter !== myName) {
            let kb = ""; "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
                kb += `<button class="letter-btn" ${h.guesses.includes(l) ? 'disabled' : ''} onclick="guessLetter('${l}')">${l}</button>`;
            });
            document.getElementById('h-keyboard').innerHTML = kb;
        } else {
            document.getElementById('h-keyboard').innerHTML = "<p class='text-[10px] opacity-50'>Partner is guessing...</p>";
        }
        drawHangman(h.strikes);
        if(h.strikes >= 6) { alert("Game Over! Word was " + h.word); db.ref('hangman').remove(); }
        if(!disp.includes("_")) {
            document.getElementById('winner-name').innerText = "WORD GUESSED!";
            document.getElementById('win-overlay').style.display = 'flex';
            db.ref('hangman').remove();
        }
    });
    function guessLetter(l) {
        db.ref('hangman').once('value', s => {
            let h = s.val(); let newG = h.guesses + l; let newS = h.word.includes(l) ? h.strikes : h.strikes + 1;
            db.ref('hangman').update({ guesses: newG, strikes: newS });
        });
    }
    function drawHangman(s) {
        const c = document.getElementById('hangman-canvas').getContext('2d');
        c.clearRect(0,0,120,120); c.lineWidth=2; c.strokeStyle="#334155";
        c.beginPath(); c.moveTo(10,110); c.lineTo(110,110); c.moveTo(30,110); c.lineTo(30,10); c.lineTo(80,10); c.lineTo(80,25); c.stroke();
        if(s>0) { c.beginPath(); c.arc(80,35,10,0,Math.PI*2); c.stroke(); }
        if(s>1) { c.beginPath(); c.moveTo(80,45); c.lineTo(80,80); c.stroke(); }
        if(s>2) { c.beginPath(); c.moveTo(80,55); c.lineTo(60,70); c.stroke(); }
        if(s>3) { c.beginPath(); c.moveTo(80,55); c.lineTo(100,70); c.stroke(); }
        if(s>4) { c.beginPath(); c.moveTo(80,80); c.lineTo(60,100); c.stroke(); }
        if(s>5) { c.beginPath(); c.moveTo(80,80); c.lineTo(100,100); c.stroke(); }
    }

    // --- REALTIME PAINT ---
    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.addEventListener('mousedown', startPaint);
    canvas.addEventListener('mousemove', paintMove);
    canvas.addEventListener('mouseup', stopPaint);
    canvas.addEventListener('touchstart', (e) => startPaint(e.touches[0]));
    canvas.addEventListener('touchmove', (e) => paintMove(e.touches[0]));
    canvas.addEventListener('touchend', stopPaint);

    function startPaint(e) { drawing = true; paintMove(e); }
    function stopPaint() { drawing = false; ctx.beginPath(); }
    function paintMove(e) {
        if(!drawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        const color = document.getElementById('paint-color').value;
        db.ref('draw').set({ x, y, color, ts: Date.now() });
    }
    db.ref('draw').on('value', s => {
        const d = s.val(); if(!d) return;
        ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = d.color;
        ctx.lineTo(d.x, d.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(d.x, d.y);
    });
    function clearCanvas() { ctx.clearRect(0,0,300,300); db.ref('draw').remove(); }

    // --- SYSTEM HELPERS ---
    function resetCurrentGameUI() {
        document.getElementById('win-overlay').style.display = 'none';
        resetTTT();
        db.ref('sos').set({ board: Array(25).fill(""), turn: "Vinod", vScore: 0, cScore: 0 });
    }
    function showSubGame(g) {
        document.querySelectorAll('#p-games .card').forEach(c => c.classList.add('hidden'));
        document.getElementById('game-' + g).classList.remove('hidden');
        if(g === 'sos') initSOSBoard();
    }
    function showPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
        document.getElementById('p-' + p).classList.add('active');
        if(p === 'stats') renderChart(); // From original water stats
    }

    // Preserve original Water/Signal Logic
    function sendSignal(t) { db.ref('signals/' + myName + '/' + t).push(Date.now()); }
    db.ref('signals/Vinod').on('value', s => { if(myName === 'Vinod') document.getElementById('my-miss-count').innerText = s.numChildren(); });
    db.ref('signals/Cindy').on('value', s => { if(myName === 'Cindy') document.getElementById('my-miss-count').innerText = s.numChildren(); });
    
    document.getElementById('loading').style.display = 'none';
</script>
</body>
</html>
