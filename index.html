<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CindVin - Always Connected</title>
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --romance-pink: #ffafbd; --romance-red: #ff4b2b; --water-blue: #00d2ff; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to bottom, #ffafbd, #ffc3a0); margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        .page { display: none; width: 100%; max-width: 450px; margin: auto; padding: 15px; padding-bottom: 100px; }
        .page.active { display: block !important; animation: fadeIn 0.4s; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); margin-bottom: 15px; border: 2px solid white; }
        
        .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .tab-item { border: none; background: none; color: #999; font-size: 0.6rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .tab-item.active { color: var(--romance-red); }
        
        /* Water UI Elements */
        .circular-progress { width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--water-blue) 0deg, #ffebee 0deg); transition: 0.5s ease; margin: 15px auto; }
        .inner-circle { width: 130px; height: 130px; background: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; text-align: center;}
        
        /* Kiss Meter */
        .kiss-active { background: #fff1f2 !important; border: 2px solid #fb7185 !important; }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .heart-pulse { animation: heartbeat 0.8s infinite; color: var(--romance-red); }

        /* Chat Reply */
        .reply-box { background: rgba(0,0,0,0.05); border-left: 4px solid var(--romance-red); padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; margin-bottom: 5px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-[9999]">💝 Syncing Our Love...</div>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white border-none text-center">
        <h2 class="font-bold">CindVin Hub</h2>
        <span id="partner-online-dot" class="text-xs font-bold text-slate-400">● Offline</span>
    </div>

    <div id="kiss-meter" class="card py-8 cursor-pointer select-none touch-none">
        <i id="kiss-icon" class="fas fa-heart text-4xl text-slate-200"></i>
        <p id="kiss-text" class="text-xs font-bold uppercase mt-3 text-slate-400">Hold for Shared Kiss</p>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="sendSignal('miss')" class="card p-5 active:scale-95 transition">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Miss You</span>
            <p id="my-miss-count" class="text-xl font-black">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5 active:scale-95 transition">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Love You</span>
            <p id="my-love-count" class="text-xl font-black">0</p>
        </button>
    </div>

    <div class="card">
        <p class="text-[10px] uppercase font-bold text-slate-400 mb-4">Set My Mood</p>
        <div class="flex justify-around text-3xl">
            <button onclick="setMood('😊')" class="hover:scale-110">😊</button>
            <button onclick="setMood('😢')" class="hover:scale-110">😢</button>
            <button onclick="setMood('❤️')" class="hover:scale-110">❤️</button>
            <button onclick="setMood('😡')" class="hover:scale-110">😡</button>
        </div>
        <div class="mt-4 pt-4 border-t">
            <p id="partner-mood-display" class="text-xs italic text-slate-600">--</p>
        </div>
    </div>
</div>

<div id="p-water" class="page">
    <div id="love-overlay" class="fixed inset-0 bg-[#ff4b2b] bg-opacity-95 hidden flex-col items-center justify-center text-white z-[2000]">
        <div style="font-size:100px; animation: heartbeat 0.8s infinite alternate;">❤️</div>
        <h1 style="font-size: 3rem;">I Love You!</h1>
        <p>Target reached! 😘</p>
        <button class="bg-white text-[#ff4b2b] px-8 py-3 rounded-full mt-5" onclick="document.getElementById('love-overlay').style.display='none'">I Love You Too ❤️</button>
    </div>

    <div class="card">
        <div class="flex justify-between font-bold text-rose-600 mb-2">
            <span>🎯 Target: <span id="display-goal">2000</span>ml</span>
            <span style="color:#b8860b;">🪙 <span id="coin-count">0</span></span>
        </div>
        <div class="circular-progress" id="progress">
            <div class="inner-circle">
                <span id="current-ml" style="font-size:1.8rem; font-weight:bold; color:#3498db;">0</span>
                <span style="color:#777; font-size:0.8rem;">ml total</span>
            </div>
        </div>
        <input type="number" id="drink-amount" value="250" class="w-full border p-3 rounded-xl mb-2 text-center">
        <button onclick="drinkWater()" class="w-full bg-sky-500 text-white font-bold py-3 rounded-xl">Drink 💧</button>
        <button onclick="resetToday()" class="w-full bg-rose-200 text-rose-700 text-xs mt-2 py-2 rounded-xl">Reset Today 🔄</button>
    </div>
</div>

<div id="p-calories" class="page">
    <div class="card">
        <h3 class="font-bold text-rose-600 mb-4 uppercase text-xs">Calorie Tracker</h3>
        <div class="flex gap-2">
            <input type="text" id="food-name" placeholder="What did you eat?" class="flex-1 border p-2 rounded-lg text-sm">
            <input type="number" id="food-cal" placeholder="kcal" class="w-20 border p-2 rounded-lg text-sm">
            <button onclick="addFood()" class="bg-rose-500 text-white px-4 rounded-lg"><i class="fas fa-plus"></i></button>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-4 text-left">
            <div>
                <p class="text-[10px] font-bold border-b mb-2">VINOD'S LOG</p>
                <div id="food-list-vinod" class="text-[10px] space-y-1"></div>
            </div>
            <div>
                <p class="text-[10px] font-bold border-b mb-2">CINDY'S LOG</p>
                <div id="food-list-cindy" class="text-[10px] space-y-1"></div>
            </div>
        </div>
    </div>
</div>

<div id="p-stats" class="page">
    <div class="card">
        <h3 class="font-bold text-rose-600 mb-6 uppercase text-xs">Love Leaderboard</h3>
        <div id="stats-area" class="space-y-6"></div>
        <hr class="my-6">
        <h3 class="font-bold text-sky-600 mb-4 uppercase text-xs">Water History</h3>
        <canvas id="statChart" height="200"></canvas>
    </div>
</div>

<div id="p-chat" class="page">
    <div class="card h-[70vh] flex flex-col p-2">
        <div id="chat-box" class="flex-grow overflow-y-auto space-y-3 p-2"></div>
        <div id="reply-preview" class="hidden reply-box mx-2"></div>
        <div class="flex gap-2 p-2 border-t">
            <input type="text" id="chat-input" placeholder="Message..." class="flex-1 p-2 text-sm outline-none">
            <button onclick="sendMessage()" class="bg-rose-500 text-white px-4 rounded-xl"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')">🏠<span>Home</span></button>
    <button class="tab-item" onclick="showPage('water')">💧<span>Water</span></button>
    <button class="tab-item" onclick="showPage('calories')">🥗<span>Calories</span></button>
    <button class="tab-item" onclick="showPage('chat')">💬<span>Chat</span></button>
    <button class="tab-item" onclick="showPage('stats')">📊<span>Stats</span></button>
</div>

<script>
    // --- FIREBASE CONFIG (Shared with your water tracker) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAkDjO1Zk_KsqnBhOYdZw8hX6ebcDv2TM8",
        authDomain: "watertracker-7c2d3.firebaseapp.com",
        databaseURL: "https://watertracker-7c2d3-default-rtdb.firebaseio.com",
        projectId: "watertracker-7c2d3",
        storageBucket: "watertracker-7c2d3.firebasestorage.app",
        messagingSenderId: "1085308071765",
        appId: "1:1085308071765:web:4fd76906f520bbde2b09dc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- IDENTITY HANDLING ---
    let myName = localStorage.getItem('hs_user') || prompt("Enter Name (Vinod/Cindy):");
    localStorage.setItem('hs_user', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';
    
    let stats = { daily: {}, coins: 0, goal: 2000, streak: 0 };
    let replyObj = null;

    // --- 1. PRESENCE ---
    const statusRef = db.ref('status/' + myName);
    db.ref('.info/connected').on('value', snap => {
        if (snap.val()) statusRef.onDisconnect().set('offline').then(() => statusRef.set('online'));
    });
    db.ref('status/' + partner).on('value', s => {
        const isOnline = s.val() === 'online';
        document.getElementById('partner-online-dot').innerText = isOnline ? '● Online' : '● Offline';
        document.getElementById('partner-online-dot').style.color = isOnline ? '#4ade80' : '#94a3b8';
    });

    // --- 2. KISS METER ---
    const kissMeter = document.getElementById('kiss-meter');
    kissMeter.addEventListener('pointerdown', () => db.ref('kiss/' + myName).set(true));
    kissMeter.addEventListener('pointerup', () => db.ref('kiss/' + myName).set(false));
    kissMeter.addEventListener('pointerleave', () => db.ref('kiss/' + myName).set(false));

    db.ref('kiss').on('value', s => {
        const k = s.val() || {};
        const both = k.Vinod && k.Cindy;
        if (both) {
            kissMeter.classList.add('kiss-active');
            document.getElementById('kiss-icon').classList.add('heart-pulse');
            document.getElementById('kiss-text').innerText = "KISSING!";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else {
            kissMeter.classList.remove('kiss-active');
            document.getElementById('kiss-icon').classList.remove('heart-pulse');
            document.getElementById('kiss-text').innerText = k[myName] ? "Waiting for " + partner : "Hold for Shared Kiss";
        }
    });

    // --- 3. MOOD ---
    function setMood(emoji) { db.ref('moods/' + myName).set(emoji); }
    db.ref('moods/' + partner).on('value', s => {
        document.getElementById('partner-mood-display').innerText = partner + " is feeling: " + (s.val() || "--");
    });

    // --- 4. WATER (YOUR ORIGINAL LOGIC) ---
    db.ref('users/' + myName).on('value', (snap) => {
        if(snap.exists()) { stats = snap.val(); }
        document.getElementById('loading').style.display = 'none';
        updateWaterUI();
    });

    function drinkWater() {
        const amt = parseInt(document.getElementById('drink-amount').value) || 0;
        const today = new Date().toLocaleDateString().replace(/\//g, '-');
        stats.daily[today] = (stats.daily[today] || 0) + amt;
        if (stats.daily[today] >= stats.goal && (stats.daily[today]-amt) < stats.goal) {
            stats.coins = (stats.coins || 0) + 10;
            document.getElementById('love-overlay').style.display = 'flex';
        }
        db.ref('users/' + myName).set(stats);
    }

    function updateWaterUI() {
        const today = new Date().toLocaleDateString().replace(/\//g, '-');
        const curr = stats.daily[today] || 0;
        document.getElementById('current-ml').innerText = curr;
        document.getElementById('coin-count').innerText = stats.coins || 0;
        document.getElementById('display-goal').innerText = stats.goal;
        const p = Math.min((curr / stats.goal) * 360, 360);
        document.getElementById('progress').style.background = `conic-gradient(var(--water-blue) ${p}deg, #ffebee 0deg)`;
    }

    // --- 5. CALORIES ---
    function addFood() {
        const name = document.getElementById('food-name').value;
        const cal = document.getElementById('food-cal').value;
        if(!name || !cal) return;
        db.ref('calories/' + myName).push({name, cal, ts: Date.now()});
        document.getElementById('food-name').value = '';
        document.getElementById('food-cal').value = '';
    }

    db.ref('calories').on('value', s => {
        const data = s.val() || {};
        ['Vinod', 'Cindy'].forEach(u => {
            const list = document.getElementById('food-list-' + u.toLowerCase());
            list.innerHTML = '';
            Object.values(data[u] || {}).forEach(f => {
                list.innerHTML += `<div class="flex justify-between"><span>${f.name}</span><span>${f.cal}</span></div>`;
            });
        });
    });

    // --- 6. CHAT ---
    function sendMessage() {
        const t = document.getElementById('chat-input').value;
        if(!t) return;
        db.ref('chat').push({ f: myName, t: t, reply: replyObj });
        document.getElementById('chat-input').value = "";
        cancelReply();
    }
    function setReply(text, sender) {
        replyObj = { text, sender };
        document.getElementById('reply-preview').innerHTML = `Replying to ${sender}: "${text}"`;
        document.getElementById('reply-preview').classList.remove('hidden');
    }
    function cancelReply() { replyObj = null; document.getElementById('reply-preview').classList.add('hidden'); }

    db.ref('chat').limitToLast(15).on('value', s => {
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        s.forEach(c => {
            const m = c.val();
            const isMe = m.f === myName;
            const rHtml = m.reply ? `<div class="reply-box">${m.reply.sender}: ${m.reply.text}</div>` : '';
            box.innerHTML += `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <div onclick="setReply('${m.t}', '${m.f}')" class="p-3 rounded-2xl max-w-[80%] text-sm ${isMe ? 'bg-rose-500 text-white rounded-tr-none' : 'bg-white border rounded-tl-none'}">
                        ${rHtml}${m.t}
                    </div>
                </div>`;
        });
        box.scrollTop = box.scrollHeight;
    });

    // --- 7. SIGNALS & STATS ---
    function sendSignal(type) { db.ref('signals/' + myName + '/' + type).push(Date.now()); }
    
    function updateStats() {
        db.ref('signals').once('value', s => {
            const data = s.val() || {};
            const types = ['miss', 'love'];
            let html = '';
            types.forEach(t => {
                const v = Object.keys(data['Vinod']?.[t] || {}).length;
                const c = Object.keys(data['Cindy']?.[t] || {}).length;
                html += `<div class="p-3 bg-white rounded-xl shadow-sm border">
                    <p class="text-[10px] font-bold uppercase mb-2">Total ${t} You</p>
                    <div class="flex justify-between">
                        <div>Vinod: <b>${v}</b></div>
                        <div>Cindy: <b>${c}</b></div>
                    </div>
                </div>`;
            });
            document.getElementById('stats-area').innerHTML = html;
        });
    }

    // --- NAV ---
    function showPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
        document.getElementById('p-' + p).classList.add('active');
        const activeTab = Array.from(document.querySelectorAll('.tab-item')).find(t => t.getAttribute('onclick').includes(p));
        if(activeTab) activeTab.classList.add('active');
        if(p === 'stats') { updateStats(); renderChart(); }
    }

    function renderChart() {
        const ctx = document.getElementById('statChart').getContext('2d');
        const dates = Object.keys(stats.daily || {}).sort().slice(-7);
        new Chart(ctx, {
            type: 'bar',
            data: { labels: dates, datasets: [{ label: 'ml', data: dates.map(d => stats.daily[d]), backgroundColor: '#ff4b2b' }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    // Connect home counters
    db.ref('signals/Vinod/miss').on('value', s => { if(myName === 'Vinod') document.getElementById('my-miss-count').innerText = s.numChildren(); });
    db.ref('signals/Vinod/love').on('value', s => { if(myName === 'Vinod') document.getElementById('my-love-count').innerText = s.numChildren(); });
    db.ref('signals/Cindy/miss').on('value', s => { if(myName === 'Cindy') document.getElementById('my-miss-count').innerText = s.numChildren(); });
    db.ref('signals/Cindy/love').on('value', s => { if(myName === 'Cindy') document.getElementById('my-love-count').innerText = s.numChildren(); });
</script>
</body>
</html>
