<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthSync Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        :root { --main-bg: #f8fafc; --accent: #0284c7; --vinod-color: #0ea5e9; --cindy-color: #f43f5e; }
        body { font-family: 'Inter', sans-serif; background: var(--main-bg); padding-bottom: 90px; overflow-x: hidden; transition: background 0.5s ease; }
        .page { display: none; width: 100%; max-width: 480px; margin: auto; padding: 15px; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid #f1f5f9; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .tab-item { border: none; background: none; color: #94a3b8; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .tab-item.active { color: var(--accent); }
        .kiss-active { background: #fff1f2 !important; border: 2px solid #fb7185 !important; transform: scale(1.02); }
        .unread-badge { position: absolute; top: -5px; right: 5px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; display: none; }
        .filter-btn { padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; background: #f1f5f9; color: #64748b; }
        .filter-btn.active { background: var(--accent); color: white; }
        @keyframes pulse-heart { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .heart-beat { animation: pulse-heart 0.8s infinite; color: #e11d48; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="live-notif" class="fixed top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-slate-900 text-white p-4 rounded-2xl shadow-2xl z-[5000] hidden flex items-center gap-3">
    <div class="bg-sky-500 p-2 rounded-full"><i class="fas fa-bell"></i></div>
    <div id="notif-text" class="text-xs font-medium"></div>
</div>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white flex justify-between items-center shadow-xl">
        <div><h2 class="font-bold text-lg italic tracking-tighter">HealthSync Pro</h2><p class="text-[10px] text-sky-400 font-mono" id="user-display">...</p></div>
        <div id="partner-status" class="text-[10px] font-bold px-3 py-1 rounded-full bg-white/10 uppercase tracking-widest">Offline</div>
    </div>
    
    <div id="kiss-meter" class="card mt-4 py-8 text-center transition-all duration-300 border-2 border-dashed border-slate-200 cursor-pointer select-none touch-none">
        <i id="kiss-icon" class="fas fa-heart text-4xl text-slate-100 transition-colors"></i>
        <p id="kiss-text" class="text-[10px] font-black uppercase tracking-widest mt-3 text-slate-400">Hold for a Kiss</p>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="sendSignal('miss')" class="card p-5 active:scale-95 transition text-center border-none shadow-md">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">Missed Her</span>
            <p id="my-miss-count" class="text-xl font-black text-slate-800">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5 active:scale-95 transition text-center border-none shadow-md">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">Loved Her</span>
            <p id="my-love-count" class="text-xl font-black text-slate-800">0</p>
        </button>
    </div>

    <div class="card flex justify-between items-center p-4">
        <div class="flex items-center gap-3">
            <span id="partner-mood" class="text-3xl">😊</span>
            <div><p class="text-[10px] font-bold uppercase text-slate-400" id="partner-label">Partner</p><p id="partner-sleep-txt" class="text-xs font-bold text-slate-800">Awake ☀️</p></div>
        </div>
        <button onclick="toggleSleep()" id="sleep-btn" class="bg-slate-100 text-slate-800 px-4 py-2 rounded-full text-[10px] font-bold uppercase">Goodnight</button>
    </div>

    <button onclick="sendNudge()" class="w-full card bg-sky-600 text-white font-bold py-4 text-xs active:scale-95 transition tracking-widest">
        <i class="fas fa-fingerprint mr-2"></i> SEND HEARTBEAT NUDGE
    </button>
</div>

<div id="p-water" class="page">
    <div class="card text-center">
        <div class="flex justify-between text-[10px] font-bold mb-4"><span>DAILY GOAL: 2000ML</span><span class="text-amber-500">COINS: <span id="coin-count">0</span></span></div>
        <div id="water-circ" class="w-40 h-40 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-sky-100 shadow-inner">
            <div class="text-center"><span id="current-ml" class="text-3xl font-black text-sky-600">0</span><br><span class="text-[10px] text-slate-400 uppercase font-bold">Total ML</span></div>
        </div>
        <input type="number" id="drink-amount" value="250" class="w-full bg-slate-50 border rounded-2xl p-4 mb-3 text-center font-bold">
        <button onclick="drinkWater()" class="w-full bg-sky-500 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95">LOG INTAKE 💧</button>
    </div>
</div>

<div id="p-calories" class="page">
    <div class="card">
        <h3 class="font-bold text-xs uppercase mb-4 text-slate-400">Nutrition Ledger</h3>
        <div class="flex gap-2 mb-4">
            <input type="text" id="food-input" placeholder="What did you eat?" class="flex-grow bg-slate-50 border rounded-xl px-4 py-3 text-sm">
            <button onclick="addCalories()" class="bg-emerald-600 text-white px-6 rounded-xl text-sm font-bold">LOG</button>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="text-[10px] font-black uppercase text-sky-600 border-b pb-1 mb-2">Vinod</p>
                <div id="ledger-vinod" class="text-[10px] space-y-2 h-48 overflow-y-auto"></div>
                <p class="font-bold text-xs pt-2 text-slate-400" id="total-vinod-cal">0 kcal</p>
            </div>
            <div>
                <p class="text-[10px] font-black uppercase text-rose-600 border-b pb-1 mb-2">Cindy</p>
                <div id="ledger-cindy" class="text-[10px] space-y-2 h-48 overflow-y-auto"></div>
                <p class="font-bold text-xs pt-2 text-slate-400" id="total-cindy-cal">0 kcal</p>
            </div>
        </div>
    </div>
</div>

<div id="p-stats" class="page">
    <div class="flex justify-between mb-4 bg-white p-2 rounded-2xl shadow-sm border">
        <button class="filter-btn active" onclick="updateStatsFilter('daily', this)">Daily</button>
        <button class="filter-btn" onclick="updateStatsFilter('weekly', this)">Weekly</button>
        <button class="filter-btn" onclick="updateStatsFilter('monthly', this)">Monthly</button>
    </div>

    <div class="card">
        <h3 class="font-bold text-[10px] uppercase text-slate-400 mb-6 tracking-widest text-center">Competition Leaderboard</h3>
        <div id="stats-container" class="space-y-6"></div>
    </div>

    <div class="card overflow-hidden">
        <h3 class="font-bold text-[10px] uppercase text-slate-400 mb-4 tracking-widest">Activity History</h3>
        <div id="history-ledger" class="text-[10px] space-y-2 h-48 overflow-y-auto pr-2"></div>
    </div>
</div>

<div id="p-games" class="page">
    <div class="card h-[70vh] p-0 overflow-hidden">
        <iframe src="https://lichess.org/tv/frame?theme=brown&bg=light" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

<div id="p-chat" class="page">
    <div class="card h-[75vh] flex flex-col bg-slate-50 p-2">
        <div id="chat-box" class="flex-grow overflow-y-auto space-y-4 p-2"></div>
        <div class="flex gap-2 p-3 bg-white rounded-3xl border shadow-sm mt-2">
            <input type="text" id="chat-input" placeholder="Secure message..." class="flex-grow px-2 py-1 text-sm outline-none">
            <button onclick="sendMessage()" class="bg-sky-500 text-white w-10 h-10 rounded-2xl flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')"><i class="fas fa-home"></i>Home</button>
    <button class="tab-item" onclick="showPage('water')"><i class="fas fa-droplet"></i>Water</button>
    <button class="tab-item" onclick="showPage('stats')"><i class="fas fa-chart-bar"></i>Stats</button>
    <button class="tab-item" onclick="showPage('calories')"><i class="fas fa-utensils"></i>Cals</button>
    <button class="tab-item" onclick="showPage('chat')"><span id="unread-count" class="unread-badge">0</span><i class="fas fa-comment"></i>Chat</button>
    <button class="tab-item" onclick="showPage('games')"><i class="fas fa-chess"></i>Games</button>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAcoPWV1RBE5DnRQHUo2EdKe0nEZOeZTr4",
        authDomain: "cindvin-740ac.firebaseapp.com",
        databaseURL: "https://cindvin-740ac-default-rtdb.firebaseio.com/",
        projectId: "cindvin-740ac",
        storageBucket: "cindvin-740ac.firebasestorage.app",
        messagingSenderId: "413173407072",
        appId: "1:413173407072:web:354efd879fde19dc035205"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem('hs_pro_v_final') || prompt("Identify (Vinod/Cindy):");
    if(myName) myName = myName.charAt(0).toUpperCase() + myName.slice(1);
    localStorage.setItem('hs_pro_v_final', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';
    
    document.getElementById('user-display').innerText = "ID: " + myName;
    document.getElementById('partner-label').innerText = partner;

    // --- 1. PRESENCE ---
    const statusRef = db.ref('status/' + myName);
    db.ref('.info/connected').on('value', snap => {
        if (snap.val()) statusRef.onDisconnect().set('offline').then(() => statusRef.set('online'));
    });
    db.ref('status/' + partner).on('value', s => {
        const pStat = document.getElementById('partner-status');
        pStat.innerText = s.val() === 'online' ? 'Online' : 'Offline';
        pStat.className = s.val() === 'online' ? 'text-[10px] font-bold px-3 py-1 rounded-full bg-green-500/20 text-green-400 uppercase' : 'text-[10px] font-bold px-3 py-1 rounded-full bg-white/10 text-white/40 uppercase';
    });

    // --- 2. KISS METER ---
    const kissMeter = document.getElementById('kiss-meter');
    const kissIcon = document.getElementById('kiss-icon');
    const kissText = document.getElementById('kiss-text');

    const handleKissStart = () => db.ref('kiss_meter/' + myName).set(true);
    const handleKissEnd = () => db.ref('kiss_meter/' + myName).set(false);

    kissMeter.addEventListener('pointerdown', handleKissStart);
    kissMeter.addEventListener('pointerup', handleKissEnd);
    kissMeter.addEventListener('pointerleave', handleKissEnd);

    db.ref('kiss_meter').on('value', s => {
        const data = s.val() || {};
        const bothTouching = data.Vinod && data.Cindy;
        if (bothTouching) {
            document.body.style.background = "#fff1f2";
            kissMeter.classList.add('kiss-active');
            kissIcon.classList.add('heart-beat');
            kissIcon.style.color = "#e11d48";
            kissText.innerText = "KISSING...";
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        } else {
            document.body.style.background = "#f8fafc";
            kissMeter.classList.remove('kiss-active');
            kissIcon.classList.remove('heart-beat');
            kissIcon.style.color = data[myName] ? "#fb7185" : "#e2e8f0";
            kissText.innerText = data[myName] ? "WAITING FOR " + partner : "Hold for a Kiss";
        }
    });

    // --- 3. MOOD & SLEEP ---
    function setMood(e) { db.ref('users/' + myName + '/mood').set(e); }
    db.ref('users/' + partner + '/mood').on('value', s => { document.getElementById('partner-mood').innerText = s.val() || '😊'; });

    function toggleSleep() {
        const isS = document.getElementById('sleep-btn').innerText === "GOODNIGHT";
        db.ref('users/' + myName + '/sleeping').set(isS);
        document.getElementById('sleep-timer').innerText = isS ? "Sleeping... 😴" : "I'm Awake ☀️";
        document.getElementById('sleep-btn').innerText = isS ? "WAKE UP" : "GOODNIGHT";
    }
    db.ref('users/' + partner + '/sleeping').on('value', s => {
        const isS = s.val();
        document.getElementById('partner-sleep-txt').innerText = isS ? "Sleeping 😴" : "Awake ☀️";
        document.getElementById('partner-sleep-txt').style.color = isS ? "#818cf8" : "#22c55e";
    });

    // --- 4. SIGNALS & STATS ---
    let currentFilter = 'daily';
    function sendSignal(type) { 
        const timestamp = Date.now();
        db.ref('stats_ledger/' + myName + '/' + type).push(timestamp);
        db.ref('stats/' + myName + '/' + type).transaction(c => (c || 0) + 1);
        if(navigator.vibrate) navigator.vibrate(50);
    }

    db.ref('stats/' + myName).on('value', s => {
        const d = s.val() || {};
        document.getElementById('my-miss-count').innerText = d.miss || 0;
        document.getElementById('my-love-count').innerText = d.love || 0;
    });

    function updateStatsFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        fetchStats();
    }

    function fetchStats() {
        db.ref('/').once('value', snap => {
            const data = snap.val() || {};
            const categories = [
                { key: 'miss', label: 'Miss You Signals', color: '#0ea5e9' },
                { key: 'love', label: 'Love Shared', color: '#f43f5e' },
                { key: 'water', label: 'Water Intake (ml)', color: '#38bdf8' },
                { key: 'cal', label: 'Calories (kcal)', color: '#10b981' }
            ];
            
            let html = "";
            categories.forEach(cat => {
                const v = calcVal(data, 'Vinod', cat.key);
                const c = calcVal(data, 'Cindy', cat.key);
                const total = (v + c) || 1;
                html += `
                    <div class="space-y-1">
                        <div class="flex justify-between text-[9px] font-black uppercase text-slate-400"><span>${cat.label}</span></div>
                        <div class="flex h-3 rounded-full bg-slate-100 overflow-hidden">
                            <div class="transition-all duration-500" style="width: ${(v/total)*100}%; background: ${cat.color}"></div>
                            <div class="transition-all duration-500 opacity-40" style="width: ${(c/total)*100}%; background: ${cat.color}"></div>
                        </div>
                        <div class="flex justify-between text-[10px] font-bold">
                            <span class="text-sky-600">Vinod: ${v}</span>
                            <span class="text-rose-500">Cindy: ${c}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('stats-container').innerHTML = html;
            renderActivity(data);
        });
    }

    function calcVal(data, user, key) {
        const now = new Date();
        let total = 0;
        
        if (key === 'miss' || key === 'love') {
            const items = data.stats_ledger?.[user]?.[key] || {};
            Object.values(items).forEach(ts => {
                if(withinFilter(ts, now)) total++;
            });
        } else if (key === 'water') {
            const logs = data.users?.[user]?.water_logs || {};
            Object.values(logs).forEach(log => {
                if(withinFilter(log.ts, now)) total += log.amt;
            });
        } else if (key === 'cal') {
            const ledger = data.ledger?.[user] || {};
            Object.values(ledger).forEach(e => {
                if(withinFilter(e.ts, now)) total += e.cal;
            });
        }
        return total;
    }

    function withinFilter(ts, now) {
        const diff = (now - ts) / (1000 * 60 * 60 * 24);
        if(currentFilter === 'daily') return diff <= 1;
        if(currentFilter === 'weekly') return diff <= 7;
        return diff <= 30;
    }

    // --- 5. NUTRITION & WATER ---
    function addCalories() {
        const f = document.getElementById('food-input').value.toLowerCase();
        const c = 150; // Default or use a library
        db.ref('ledger/' + myName).push({ item: f, cal: c, ts: Date.now() });
        document.getElementById('food-input').value = "";
    }

    function renderActivity(data) {
        let html = "";
        ['Vinod', 'Cindy'].forEach(u => {
            const ledger = data.ledger?.[u] || {};
            Object.values(ledger).forEach(e => {
                html = `<div class="flex justify-between border-b pb-1"><span><b>${u}</b> ate ${e.item}</span><span>${e.cal}</span></div>` + html;
            });
        });
        document.getElementById('history-ledger').innerHTML = html || "<p class='text-center'>No activity yet</p>";
    }

    function updateLedgerUI() {
        db.ref('ledger').on('value', s => {
            const data = s.val() || {};
            const render = (user, el, tot) => {
                let h = ""; let t = 0;
                Object.values(data[user] || {}).forEach(e => {
                    h = `<div class="flex justify-between border-b border-slate-50 py-1"><span>${e.item}</span><span class="font-bold">${e.cal}</span></div>` + h;
                    t += e.cal;
                });
                document.getElementById(el).innerHTML = h;
                document.getElementById(tot).innerText = t + " kcal";
            };
            render('Vinod', 'ledger-vinod', 'total-vinod-cal');
            render('Cindy', 'ledger-cindy', 'total-cindy-cal');
        });
    }
    updateLedgerUI();

    function drinkWater() {
        const amt = parseInt(document.getElementById('drink-amount').value);
        db.ref('users/' + myName + '/water_logs').push({ amt, ts: Date.now() });
    }
    db.ref('users/' + myName + '/water_logs').on('value', s => {
        let todayTot = 0;
        const now = new Date();
        s.forEach(child => { if(withinFilter(child.val().ts, now)) todayTot += child.val().amt; });
        document.getElementById('current-ml').innerText = todayTot;
        const p = Math.min((todayTot / 2000) * 360, 360);
        document.getElementById('water-circ').style.background = `conic-gradient(#0ea5e9 ${p}deg, #f1f5f9 0deg)`;
    });

    // --- 6. CHAT & NUDGE ---
    let lastViewed = 0;
    function sendMessage() {
        const t = document.getElementById('chat-input').value;
        if(t) db.ref('sync/chat').push({ f: myName, t: t, ts: Date.now() });
        document.getElementById('chat-input').value = "";
    }
    db.ref('sync/chat').on('value', s => {
        const box = document.getElementById('chat-box'); box.innerHTML = "";
        s.forEach(c => {
            const m = c.val();
            const d = document.createElement('div');
            d.className = `p-3 rounded-2xl max-w-[85%] text-sm ${m.f === myName ? 'bg-sky-500 text-white ml-auto' : 'bg-white border'}`;
            d.innerHTML = m.t; box.appendChild(d);
        });
        box.scrollTop = box.scrollHeight;
        
        // Unread Badge
        const count = s.numChildren();
        if(count > lastViewed && document.getElementById('p-chat').style.display !== 'block') {
            const b = document.getElementById('unread-count');
            b.innerText = count - lastViewed; b.style.display = 'flex';
        }
    });

    function sendNudge() { db.ref('nudge/' + partner).set(Date.now()); }
    db.ref('nudge/' + myName).on('value', s => {
        if(s.val() && (Date.now() - s.val() < 5000)) {
            if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
            showLiveNotif("💓 " + partner + " is nudging you!");
        }
    });

    function showLiveNotif(msg) {
        $("#notif-text").text(msg);
        $("#live-notif").fadeIn().delay(3000).fadeOut();
    }

    // --- 7. NAV ---
    function showPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
        const el = document.getElementById('p-' + p);
        el.style.display = 'block'; el.classList.add('active');
        event.currentTarget.classList.add('active');
        if(p === 'chat') {
            document.getElementById('unread-count').style.display = 'none';
            db.ref('sync/chat').once('value', s => lastViewed = s.numChildren());
        }
        if(p === 'stats') fetchStats();
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    Notification.requestPermission();
</script>
</body>
</html>
