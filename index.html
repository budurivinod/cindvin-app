<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CindVin - Connected</title>
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --romance-pink: #ffafbd; --romance-red: #ff4b2b; --water-blue: #00d2ff; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to bottom, #ffafbd, #ffc3a0); margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        .page { display: none; width: 100%; max-width: 450px; margin: auto; padding: 15px; padding-bottom: 100px; }
        .page.active { display: block !important; animation: fadeIn 0.4s; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; border: 2px solid white; }
        
        .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .tab-item { border: none; background: none; color: #999; font-size: 0.6rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .tab-item.active { color: var(--romance-red); }
        
        /* Water UI Elements from your code */
        .circular-progress { width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--water-blue) 0deg, #ffebee 0deg); transition: 0.5s ease; margin: 15px auto; }
        .inner-circle { width: 130px; height: 130px; background: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        
        /* Tic Tac Toe */
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .ttt-cell { aspect-ratio: 1; background: #f8fafc; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; border: 1px solid #eee; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-[9999]">💝 Syncing Our Love...</div>

<div id="p-home" class="page active">
    <div class="card bg-slate-900 text-white border-none flex justify-between items-center">
        <div><h2 class="font-bold">CindVin Hub</h2><p id="user-display" class="text-[9px] opacity-60 uppercase"></p></div>
        <div class="text-right text-xs font-bold" id="partner-status">● Offline</div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4 mt-2">
        <button onclick="sendSignal('miss')" class="card p-5 active:scale-95 transition">
            <i class="fas fa-heart-broken text-sky-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Miss You</span>
            <p id="my-miss-count" class="text-xl font-black">0</p>
        </button>
        <button onclick="sendSignal('love')" class="card p-5 active:scale-95 transition">
            <i class="fas fa-heart text-rose-500 text-2xl mb-1"></i><br>
            <span class="text-[10px] font-bold uppercase text-slate-400">I Love You</span>
            <p id="my-love-count" class="text-xl font-black">0</p>
        </button>
    </div>
</div>

<div id="p-water" class="page">
    <div class="card">
        <div class="flex justify-between font-bold text-rose-600 mb-2">
            <span>🎯 Target: <span id="display-goal">2000</span>ml</span>
            <span style="color:#b8860b;">🪙 <span id="coin-count">0</span></span>
        </div>
        <div class="circular-progress" id="progress">
            <div class="inner-circle">
                <span id="current-ml" style="font-size:1.8rem; font-weight:bold; color:#3498db;">0</span>
                <span style="color:#777; font-size:0.8rem;">ml total</span>
            </div>
        </div>
        <input type="number" id="drink-amount" value="250" class="w-full border p-3 rounded-xl mb-2 text-center text-lg">
        <button style="background: linear-gradient(to right, #00d2ff, #3a7bd5); width: 100%;" class="text-white font-bold py-3 rounded-xl" onclick="drinkWater()">Drink 💧</button>
        <button style="background: #fab1a0; width: 100%; margin-top:10px; font-size:0.8rem;" class="text-white py-2 rounded-xl" onclick="resetToday()">Reset Today's Water 🔄</button>
    </div>
</div>

<div id="p-stats" class="page">
    <div class="flex justify-around mb-4 bg-white p-2 rounded-2xl border">
        <button class="px-4 py-1 text-[10px] font-bold rounded-lg bg-rose-500 text-white" onclick="renderDetailedCharts('daily')">Daily</button>
        <button class="px-4 py-1 text-[10px] font-bold rounded-lg bg-slate-100" onclick="renderDetailedCharts('weekly')">Weekly</button>
        <button class="px-4 py-1 text-[10px] font-bold rounded-lg bg-slate-100" onclick="renderDetailedCharts('monthly')">Monthly</button>
    </div>
    <div class="card">
        <h3 class="text-[10px] font-black uppercase text-slate-400 mb-6 tracking-widest">Love Click Comparison</h3>
        <canvas id="loveChart" height="300"></canvas>
    </div>
</div>

<div id="p-games" class="page">
    <div class="card text-center">
        <h3 class="font-bold mb-4 uppercase text-xs">Tic-Tac-Toe</h3>
        <div class="ttt-grid" id="ttt-board">
            <div class="ttt-cell" onclick="playTTT(0)"></div>
            <div class="ttt-cell" onclick="playTTT(1)"></div>
            <div class="ttt-cell" onclick="playTTT(2)"></div>
            <div class="ttt-cell" onclick="playTTT(3)"></div>
            <div class="ttt-cell" onclick="playTTT(4)"></div>
            <div class="ttt-cell" onclick="playTTT(5)"></div>
            <div class="ttt-cell" onclick="playTTT(6)"></div>
            <div class="ttt-cell" onclick="playTTT(7)"></div>
            <div class="ttt-cell" onclick="playTTT(8)"></div>
        </div>
        <p id="ttt-status" class="mt-4 text-xs font-bold text-rose-500">Connecting...</p>
        <button onclick="resetTTT()" class="mt-4 text-[10px] text-slate-400 font-bold uppercase underline">Reset Game</button>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-item active" onclick="showPage('home')">🏠<span>Home</span></button>
    <button class="tab-item" onclick="showPage('water')">💧<span>Water</span></button>
    <button class="tab-item" onclick="showPage('stats')">📊<span>Stats</span></button>
    <button class="tab-item" onclick="showPage('games')">🎮<span>Games</span></button>
</div>

<script>
    // --- FIREBASE CONFIG (Sync with your database) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAkDjO1Zk_KsqnBhOYdZw8hX6ebcDv2TM8",
        authDomain: "watertracker-7c2d3.firebaseapp.com",
        databaseURL: "https://watertracker-7c2d3-default-rtdb.firebaseio.com",
        projectId: "watertracker-7c2d3",
        storageBucket: "watertracker-7c2d3.firebasestorage.app",
        messagingSenderId: "1085308071765",
        appId: "1:1085308071765:web:4fd76906f520bbde2b09dc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem('hs_user') || prompt("Identity (Vinod/Cindy):");
    localStorage.setItem('hs_user', myName);
    const partner = myName === 'Vinod' ? 'Cindy' : 'Vinod';
    document.getElementById('user-display').innerText = "Logged in: " + myName;

    let waterStats = { daily: {}, coins: 0, goal: 2000 };
    let loveChart;

    // --- 1. STATISTICS ENGINE ---
    function sendSignal(type) {
        const timestamp = Date.now();
        db.ref('stats_ledger/' + myName + '/' + type).push(timestamp);
        if(navigator.vibrate) navigator.vibrate(100);
    }

    function renderDetailedCharts(filter) {
        db.ref('stats_ledger').once('value', s => {
            const data = s.val() || {};
            const ctx = document.getElementById('loveChart').getContext('2d');
            
            const vMiss = countSignal(data['Vinod']?.['miss'], filter);
            const cMiss = countSignal(data['Cindy']?.['miss'], filter);
            const vLove = countSignal(data['Vinod']?.['love'], filter);
            const cLove = countSignal(data['Cindy']?.['love'], filter);

            if(loveChart) loveChart.destroy();
            loveChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Missed You', 'Love You'],
                    datasets: [
                        { label: 'Vinod', data: [vMiss, vLove], backgroundColor: '#38bdf8', borderRadius: 8 },
                        { label: 'Cindy', data: [cMiss, cLove], backgroundColor: '#f43f5e', borderRadius: 8 }
                    ]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        });
    }

    function countSignal(entries, filter) {
        if(!entries) return 0;
        const now = Date.now();
        const limits = { daily: 86400000, weekly: 604800000, monthly: 2592000000 };
        return Object.values(entries).filter(ts => (now - ts) < limits[filter]).length;
    }

    // --- 2. TIC TAC TOE GAME ---
    function playTTT(i) {
        db.ref('games/ttt').once('value', s => {
            const game = s.val() || { board: Array(9).fill(""), turn: "Vinod" };
            if(game.turn !== myName || game.board[i]) return;
            game.board[i] = (myName === 'Vinod' ? 'X' : 'O');
            game.turn = partner;
            db.ref('games/ttt').set(game);
        });
    }

    db.ref('games/ttt').on('value', s => {
        const game = s.val() || { board: Array(9).fill(""), turn: "Vinod" };
        const cells = document.querySelectorAll('.ttt-cell');
        game.board.forEach((val, i) => cells[i].innerText = val || "");
        document.getElementById('ttt-status').innerText = game.turn === myName ? "Your Turn!" : partner + "'s Turn...";
    });

    function resetTTT() { db.ref('games/ttt').set({ board: Array(9).fill(""), turn: "Vinod" }); }

    // --- 3. WATER TRACKER (Incorporated from your code) ---
    function drinkWater() {
        const amt = parseInt(document.getElementById('drink-amount').value) || 0;
        const today = new Date().toLocaleDateString().replace(/\//g, '-');
        const old = waterStats.daily[today] || 0;
        waterStats.daily[today] = old + amt;

        if (waterStats.daily[today] >= waterStats.goal && old < waterStats.goal) {
            waterStats.coins = (waterStats.coins || 0) + 10;
        }
        db.ref('users/' + myName).set(waterStats);
    }

    function resetToday() {
        const today = new Date().toLocaleDateString().replace(/\//g, '-');
        waterStats.daily[today] = 0;
        db.ref('users/' + myName).set(waterStats);
    }

    db.ref('users/' + myName).on('value', snap => {
        if(snap.exists()) waterStats = snap.val();
        const today = new Date().toLocaleDateString().replace(/\//g, '-');
        const curr = waterStats.daily?.[today] || 0;
        document.getElementById('current-ml').innerText = curr;
        document.getElementById('coin-count').innerText = waterStats.coins || 0;
        const p = Math.min((curr / waterStats.goal) * 360, 360);
        document.getElementById('progress').style.background = `conic-gradient(var(--water-blue) ${p}deg, #ffebee 0deg)`;
        document.getElementById('loading').style.display = 'none';
    });

    // --- NAV ---
    function showPage(p) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
        document.getElementById('p-' + p).classList.add('active');
        const activeTab = Array.from(document.querySelectorAll('.tab-item')).find(t => t.getAttribute('onclick').includes(p));
        if(activeTab) activeTab.classList.add('active');
        if(p === 'stats') renderDetailedCharts('daily');
    }

    // Presence
    db.ref('status/' + myName).onDisconnect().set('offline');
    db.ref('status/' + myName).set('online');
    db.ref('status/' + partner).on('value', s => {
        const isOnline = s.val() === 'online';
        document.getElementById('partner-status').innerText = isOnline ? '● Online' : '● Offline';
        document.getElementById('partner-status').style.color = isOnline ? '#4ade80' : '#94a3b8';
    });

    // Home counts
    db.ref('stats_ledger/Vinod/miss').on('value', s => { if(myName === 'Vinod') document.getElementById('my-miss-count').innerText = s.numChildren(); });
    db.ref('stats_ledger/Vinod/love').on('value', s => { if(myName === 'Vinod') document.getElementById('my-love-count').innerText = s.numChildren(); });
    db.ref('stats_ledger/Cindy/miss').on('value', s => { if(myName === 'Cindy') document.getElementById('my-miss-count').innerText = s.numChildren(); });
    db.ref('stats_ledger/Cindy/love').on('value', s => { if(myName === 'Cindy') document.getElementById('my-love-count').innerText = s.numChildren(); });
</script>
</body>
</html>
